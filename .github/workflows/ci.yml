name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean package

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        load: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{ github.sha }}

    - name: Run container and verify app
      run: |
        docker run -d --name boardgame-test -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/boardgame:${{ github.sha }}
        sleep 15
        curl --retry 10 --retry-connrefused --retry-delay 3 http://localhost:8080/ | head -n 20
      shell: bash

    - name: Stop and remove container
      run: |
        docker stop boardgame-test || true
        docker rm boardgame-test || true
      shell: bash