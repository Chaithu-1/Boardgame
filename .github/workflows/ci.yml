name: Complete DevSecOps CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: yourdockerhubusername/java-app

jobs:

  devsecops-pipeline:
    runs-on: ubuntu-latest

    steps:

    #################################################
    # Checkout Code
    #################################################

    - name: Checkout Source Code
      uses: actions/checkout@v4

    #################################################
    # Setup Java & Maven
    #################################################

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Cache Maven Packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2

    #################################################
    # Maven Build
    #################################################

    - name: Build Application
      run: mvn clean package -DskipTests

    #################################################
    # SonarQube Scan
    #################################################

    - name: SonarQube Analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
        -Dsonar.projectKey=java-app \
        -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
        -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    #################################################
    # Install Trivy
    #################################################

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release -y

        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
        gpg --dearmor | \
        sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
        sudo tee /etc/apt/sources.list.d/trivy.list

        sudo apt-get update
        sudo apt-get install trivy -y

    #################################################
    # Trivy Filesystem Scan
    #################################################

    - name: Trivy Filesystem Scan
      run: |
        trivy fs . \
        --severity HIGH,CRITICAL \
        --format table \
        --exit-code 0

    #################################################
    # Install Checkov
    #################################################

    - name: Install Checkov
      run: |
        pip install checkov

    #################################################
    # Checkov Scan
    #################################################

    - name: Checkov IaC Scan
      run: |
        checkov -d . \
        --framework kubernetes,dockerfile,github_actions,helm \
        --soft-fail

    #################################################
    # DockerHub Login
    #################################################

    - name: DockerHub Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    #################################################
    # Generate Commit SHA Tag
    #################################################

    - name: Generate Image Tag
      run: |
        echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    #################################################
    # Docker Build
    #################################################

    - name: Build Docker Image
      run: |
        docker build -t $IMAGE_NAME:$IMAGE_TAG .
        docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest

    #################################################
    # Trivy Docker Image Scan
    #################################################

    - name: Trivy Image Scan
      run: |
        trivy image $IMAGE_NAME:$IMAGE_TAG \
        --severity HIGH,CRITICAL \
        --format table \
        --exit-code 0

    #################################################
    # Push Docker Images
    #################################################

    - name: Push Docker Images
      run: |
        docker push $IMAGE_NAME:$IMAGE_TAG
        docker push $IMAGE_NAME:latest

    #################################################
    # Update Helm values.yaml
    #################################################

    - name: Update Helm Image Tag
      run: |
        sed -i "s/tag:.*/tag: \"$IMAGE_TAG\"/g" helm-chart/values.yaml

    #################################################
    # Commit Updated Helm values.yaml
    #################################################

    - name: Commit Helm Changes
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "github-actions"

        git add helm-chart/values.yaml

        git commit -m "Updated image tag to $IMAGE_TAG" || echo "No changes to commit"

    #################################################
    # Push Helm Changes
    #################################################

    - name: Push Helm Changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main