apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: java-app-qa
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/yourusername/yourrepo.git
    targetRevision: qa
    path: helm-chart

    helm:
      valueFiles:
        - values-qa.yaml

  destination:
    server: https://qa-cluster-api-server
    namespace: qa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true