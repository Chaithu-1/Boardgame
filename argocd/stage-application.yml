apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: java-app-stage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/yourusername/yourrepo.git
    targetRevision: stage
    path: helm-chart

    helm:
      valueFiles:
        - values-stage.yaml

  destination:
    server: https://stage-cluster-api-server
    namespace: stage

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
