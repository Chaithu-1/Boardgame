apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: java-app-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/yourusername/yourrepo.git
    targetRevision: dev
    path: helm-chart

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://dev-cluster-api-server
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
