apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boardgame-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/boardgame-repo
    targetRevision: HEAD
    path: helm
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: boardgame
  syncPolicy:
    automated:
      prune: true
      selfHeal: true