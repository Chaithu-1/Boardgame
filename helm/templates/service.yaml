apiVersion: v1
kind: Service
metadata:
  name: {{ include "boardgame.fullname" . }}
  labels:
    {{- include "boardgame.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "boardgame.selectorLabels" . | nindent 4 }}
{{- if and .Values.deployment.useRollout (eq .Values.deployment.strategy "blueGreen") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ default (printf "%s-preview" (include "boardgame.fullname" .)) .Values.deployment.blueGreen.previewService }}
  labels:
    {{- include "boardgame.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "boardgame.selectorLabels" . | nindent 4 }}
{{- end }}
