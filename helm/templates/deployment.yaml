{{- if .Values.deployment.useRollout }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "boardgame.fullname" . }}
  labels:
    {{- include "boardgame.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "boardgame.selectorLabels" . | nindent 6 }}
  {{- if .Values.deployment.useRollout }}
  strategy:
    {{- if eq .Values.deployment.strategy "blueGreen" }}
    blueGreen:
      activeService: {{ default (include "boardgame.fullname" .) .Values.deployment.blueGreen.activeService }}
      previewService: {{ default (printf "%s-preview" (include "boardgame.fullname" .)) .Values.deployment.blueGreen.previewService }}
      autoPromotionEnabled: {{ .Values.deployment.blueGreen.autoPromotionEnabled | default false }}
      {{- if .Values.deployment.blueGreen.previewDelaySeconds }}
      previewDelaySeconds: {{ .Values.deployment.blueGreen.previewDelaySeconds }}
      {{- end }}
    {{- else if eq .Values.deployment.strategy "canary" }}
    canary:
      maxSurge: {{ default "25%" .Values.deployment.canary.maxSurge }}
      maxUnavailable: {{ default "0" .Values.deployment.canary.maxUnavailable }}
      steps:
      {{- range .Values.deployment.canary.steps }}
      - {{ toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    blueGreen:
      activeService: {{ default (include "boardgame.fullname" .) .Values.deployment.blueGreen.activeService }}
      previewService: {{ default (printf "%s-preview" (include "boardgame.fullname" .)) .Values.deployment.blueGreen.previewService }}
      autoPromotionEnabled: false
    {{- end }}
  {{- else }}
  strategy:
    type: {{ default "RollingUpdate" .Values.deployment.strategy }}
    rollingUpdate:
      maxSurge: {{ default "25%" .Values.deployment.rollingUpdate.maxSurge }}
      maxUnavailable: {{ default "25%" .Values.deployment.rollingUpdate.maxUnavailable }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "boardgame.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "boardgame.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        {{- with .Values.env }}
        env:
          {{- toYaml . | nindent 12 }}
        {{- end }}
