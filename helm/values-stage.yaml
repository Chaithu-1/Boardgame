replicaCount: 1

image:
  repository: java-app
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: stage.chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: boardgame-stage-tls
      hosts:
        - stage.chart-example.local

resources:
  limits:
    cpu: 400m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

env: [ "stage" ]

application:
  properties:
    logging.level.root: INFO
